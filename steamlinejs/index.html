<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d1a">
<title>Streamline — Neon Demake</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f6f2ff;
    --muted: #8d98b5;
    --panel: rgba(16, 23, 42, .78);
    --line: rgba(148, 163, 205, .16);
    --pink: #ff3d9a;
    --violet: #ad5cff;
    --cyan: #3fd8ff;
  }

  * { box-sizing: border-box; }

  html, body {
    min-height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    place-items: center;
    overflow-x: hidden;
    padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    background:
      radial-gradient(circle at 18% 15%, rgba(173, 92, 255, .17), transparent 30rem),
      radial-gradient(circle at 83% 85%, rgba(255, 61, 154, .13), transparent 32rem),
      #080d1a;
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none;
  }

  body::before {
    position: fixed;
    inset: 0;
    pointer-events: none;
    content: "";
    opacity: .25;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(to bottom, black, transparent 85%);
  }

  .game {
    position: relative;
    width: min(100%, 980px);
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 28px;
    background: var(--panel);
    box-shadow: 0 32px 90px rgba(0, 0, 0, .48), inset 0 1px rgba(255,255,255,.04);
    backdrop-filter: blur(18px);
  }

  .topbar {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 20px;
    padding: 22px 26px 17px;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
  }

  .mark {
    position: relative;
    width: 40px;
    height: 40px;
    flex: 0 0 auto;
    border-radius: 14px;
    background: linear-gradient(145deg, var(--pink), var(--violet));
    box-shadow: 0 8px 30px rgba(255, 61, 154, .3);
  }

  .mark::before {
    position: absolute;
    inset: 10px;
    border: 3px solid white;
    border-left-color: transparent;
    border-radius: 50%;
    content: "";
  }

  h1 {
    margin: 0;
    font-size: clamp(20px, 3vw, 27px);
    font-weight: 760;
    letter-spacing: -.04em;
  }

  .eyebrow {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 10px;
    font-weight: 750;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .level-block {
    min-width: 150px;
    text-align: right;
  }

  #level {
    color: #cfd6ea;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .13em;
  }

  .progress {
    width: 150px;
    height: 4px;
    margin-top: 9px;
    overflow: hidden;
    border-radius: 99px;
    background: rgba(255,255,255,.08);
  }

  #progress-fill {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--pink), var(--violet));
    box-shadow: 0 0 12px var(--pink);
    transition: width .35s ease;
  }

  .content {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 180px;
    gap: 24px;
    padding: 24px;
  }

  .board-shell {
    display: grid;
    place-items: center;
    min-width: 0;
    min-height: 300px;
    padding: 12px;
    border: 1px solid rgba(255,255,255,.055);
    border-radius: 22px;
    background: rgba(4, 8, 18, .52);
    box-shadow: inset 0 0 50px rgba(0,0,0,.3);
  }

  #canvas {
    display: block;
    max-width: 100%;
    border-radius: 18px;
    outline: none;
    touch-action: none;
    cursor: grab;
    filter: saturate(1.08);
  }

  #canvas:active { cursor: grabbing; }

  .side {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .stat, .legend {
    padding: 17px;
    border: 1px solid var(--line);
    border-radius: 17px;
    background: rgba(255,255,255,.025);
  }

  .label {
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .17em;
    text-transform: uppercase;
  }

  #moves {
    display: block;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
    font-size: 34px;
    font-weight: 750;
    letter-spacing: -.05em;
  }

  .legend {
    display: grid;
    gap: 11px;
    color: #b2bdd7;
    font-size: 11px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .swatch {
    width: 9px;
    height: 9px;
    flex: 0 0 auto;
    border-radius: 50%;
    box-shadow: 0 0 10px currentColor;
  }

  .portal { color: var(--violet); border: 2px solid currentColor; background: transparent; }
  .anchor { color: var(--cyan); background: currentColor; }
  .reset { color: #55f2c3; background: currentColor; }
  .danger { color: #ff5a72; border-radius: 2px; background: currentColor; }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(3, 42px);
    place-content: center;
    gap: 5px;
    margin-top: auto;
  }

  button {
    appearance: none;
    border: 1px solid rgba(255,255,255,.11);
    color: #dce3f6;
    background: rgba(255,255,255,.045);
    font: inherit;
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }

  button:hover {
    border-color: rgba(255, 61, 154, .42);
    background: rgba(255,61,154,.09);
  }

  button:active { transform: scale(.94); }
  button:disabled { cursor: default; opacity: .3; }

  .dir {
    border-radius: 13px;
    font-size: 17px;
  }

  .dir.up { grid-column: 2; grid-row: 1; }
  .dir.left { grid-column: 1; grid-row: 2; }
  .dir.down { grid-column: 2; grid-row: 2; }
  .dir.right { grid-column: 3; grid-row: 2; }

  .footer {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 18px;
    min-height: 70px;
    padding: 14px 24px 18px;
    border-top: 1px solid var(--line);
  }

  #msg {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
  }

  #msg[data-tone="win"] { color: #dfc8ff; }
  #msg[data-tone="blocked"] { color: #ff8294; }

  .actions {
    display: flex;
    gap: 8px;
  }

  .action {
    min-height: 38px;
    padding: 0 14px;
    border-radius: 11px;
    font-size: 11px;
    font-weight: 700;
  }

  #next-btn {
    border-color: rgba(173,92,255,.4);
    background: rgba(173,92,255,.11);
  }

  kbd {
    display: inline-grid;
    min-width: 20px;
    height: 20px;
    place-items: center;
    margin-left: 4px;
    border: 1px solid rgba(255,255,255,.13);
    border-bottom-width: 2px;
    border-radius: 5px;
    color: #aeb8d2;
    background: rgba(255,255,255,.04);
    font: 9px/1 inherit;
  }

  @media (max-width: 700px) {
    body { display: block; padding: 10px; }
    .game { border-radius: 22px; }
    .topbar { padding: 17px; }
    .level-block { min-width: 105px; }
    .progress { width: 105px; }
    .content { grid-template-columns: 1fr; gap: 14px; padding: 14px; }
    .board-shell { padding: 7px; }
    .side { display: grid; grid-template-columns: 90px 1fr; align-items: stretch; }
    .legend { display: none; }
    .stat { padding: 12px 15px; }
    #moves { font-size: 27px; }
    .dpad { margin: 0; }
    .footer { grid-template-columns: 1fr; padding: 14px 17px 17px; }
    .actions { width: 100%; }
    .action { flex: 1; }
    kbd { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="game" aria-label="Streamline puzzle game">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>Streamline</h1>
        <p class="eyebrow">Neon demake</p>
      </div>
    </div>
    <div class="level-block">
      <div id="level">LEVEL 01 / 16</div>
      <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>
    </div>
  </header>

  <section class="content">
    <div class="board-shell">
      <canvas id="canvas" tabindex="0" aria-label="Game board. Swipe or use arrow keys to move."></canvas>
    </div>

    <aside class="side">
      <div class="stat">
        <span class="label">Moves</span>
        <strong id="moves">00</strong>
      </div>

      <div class="legend" aria-label="Tile legend">
        <span class="label">Signals</span>
        <div class="legend-row"><span class="swatch portal"></span> Portal</div>
        <div class="legend-row"><span class="swatch anchor"></span> Stop</div>
        <div class="legend-row"><span class="swatch reset"></span> Clear line</div>
        <div class="legend-row"><span class="swatch danger"></span> Trap</div>
      </div>

      <div class="dpad" aria-label="Movement controls">
        <button class="dir up" data-dir="0" aria-label="Move up">↑</button>
        <button class="dir left" data-dir="3" aria-label="Move left">←</button>
        <button class="dir down" data-dir="2" aria-label="Move down">↓</button>
        <button class="dir right" data-dir="1" aria-label="Move right">→</button>
      </div>
    </aside>
  </section>

  <footer class="footer">
    <div id="msg" role="status">Draw a path to the violet portal.</div>
    <div class="actions">
      <button id="undo-btn" class="action">Undo <kbd>U</kbd></button>
      <button id="reset-btn" class="action">Restart <kbd>R</kbd></button>
      <button id="next-btn" class="action">Next <kbd>N</kbd></button>
    </div>
  </footer>
</main>

<script src="streamline.js"></script>
</body>
</html>
