<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GACEK Sprite Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 12px; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

/* ── TOP BAR ── */
#topbar { background: #16213e; border-bottom: 2px solid #0f3460; display: flex; align-items: center; padding: 4px 8px; gap: 8px; flex-shrink: 0; }
#topbar h1 { font-size: 14px; color: #e94560; letter-spacing: 2px; margin-right: 8px; }
.btn { background: #0f3460; border: 1px solid #e94560; color: #e0e0e0; padding: 3px 10px; cursor: pointer; font-size: 11px; font-family: inherit; }
.btn:hover { background: #e94560; color: #fff; }
.btn.active { background: #e94560; color: #fff; }
select { background: #0f3460; border: 1px solid #533483; color: #e0e0e0; padding: 3px 6px; font-family: inherit; font-size: 11px; }
#sprite-selector { min-width: 200px; }
#zoom-val { color: #aaa; min-width: 28px; text-align: right; }
#topbar label { color: #aaa; }
#info-bar { margin-left: auto; color: #888; font-size: 10px; }

/* ── MAIN LAYOUT ── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── LEFT: TOOLS + COLOR ── */
#sidebar-left { width: 54px; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; align-items: center; padding: 6px 4px; gap: 4px; flex-shrink: 0; overflow-y: auto; }
.tool-btn { width: 40px; height: 40px; background: #0f3460; border: 1px solid #533483; color: #ccc; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; title: ''; }
.tool-btn:hover { border-color: #e94560; }
.tool-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
.sidebar-sep { width: 38px; height: 1px; background: #0f3460; margin: 2px 0; }
#fg-swatch, #bg-swatch { width: 36px; height: 24px; border: 2px solid #533483; cursor: pointer; image-rendering: pixelated; }
#fg-swatch { position: relative; z-index: 2; }
#bg-swatch { position: relative; top: -8px; left: 8px; z-index: 1; border-color: #222; }
.swatch-wrap { position: relative; width: 44px; height: 40px; margin-top: 4px; }
#swap-btn { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; background: #533483; border: none; color: #fff; cursor: pointer; font-size: 9px; padding: 0; }

/* ── CENTER: CANVAS ── */
#canvas-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #12122a; overflow: hidden; position: relative; }
#editor-canvas { image-rendering: pixelated; cursor: crosshair; border: 1px solid #533483; }
#canvas-overlay { position: absolute; pointer-events: none; }
#pos-label { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 2px 8px; font-size: 10px; color: #888; }

/* ── RIGHT: PALETTE + SHEET ── */
#sidebar-right { width: 220px; background: #16213e; border-left: 1px solid #0f3460; display: flex; flex-direction: column; flex-shrink: 0; }
.panel-title { background: #0f3460; padding: 4px 8px; font-size: 10px; color: #e94560; letter-spacing: 1px; display: flex; align-items: center; justify-content: space-between; }
.panel-title span { font-size: 9px; color: #888; cursor: pointer; }
.panel-title span:hover { color: #e94560; }

/* Palette */
#palette-panel { flex-shrink: 0; }
#palette-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1px; padding: 4px; background: #12122a; }
.pal-cell { width: 14px; height: 14px; cursor: pointer; border: 1px solid transparent; image-rendering: pixelated; }
.pal-cell:hover { border-color: #fff; }
.pal-cell.selected-fg { border: 2px solid #fff; }
.pal-cell.selected-bg { border: 2px solid #ff0; outline: 1px solid #f00; }
.pal-cell.idx0 { background: repeating-conic-gradient(#333 0% 25%, #555 0% 50%) 0 0 / 6px 6px; }
#pal-editor { padding: 4px 6px; display: none; }
#pal-editor.visible { display: block; }
#pal-editor input[type=range] { width: 100%; accent-color: #e94560; }
#pal-editor label { color: #888; }
#pal-hex { background: #0a0a1a; border: 1px solid #533483; color: #0f0; padding: 2px 4px; width: 70px; font-family: inherit; font-size: 11px; }
#pal-preview { width: 20px; height: 20px; border: 1px solid #533483; display: inline-block; vertical-align: middle; margin-left: 4px; }

/* Sheet panel */
#sheet-panel { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
#sheet-wrap { flex: 1; overflow: auto; padding: 4px; background: #12122a; }
#sheet-canvas { image-rendering: pixelated; display: block; cursor: pointer; }
#sheet-info { padding: 4px 6px; font-size: 10px; color: #888; flex-shrink: 0; }

/* ── BOTTOM: ANIMATION PREVIEW ── */
#bottom-bar { height: 70px; background: #16213e; border-top: 1px solid #0f3460; display: flex; align-items: center; gap: 8px; padding: 4px 8px; flex-shrink: 0; }
#anim-canvas { image-rendering: pixelated; border: 1px solid #533483; background: #000030; }
#anim-controls { display: flex; flex-direction: column; gap: 4px; }
#anim-controls label { color: #888; font-size: 10px; }
#frame-strip { display: flex; gap: 3px; overflow-x: auto; flex: 1; align-items: center; }
.frame-thumb { border: 1px solid #533483; cursor: pointer; image-rendering: pixelated; flex-shrink: 0; }
.frame-thumb.active { border-color: #e94560; }
#bottom-info { margin-left: auto; color: #555; font-size: 10px; text-align: right; line-height: 1.6; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <h1>GACEK SPR</h1>
  <label>Sprite:</label>
  <select id="sprite-selector"></select>
  <button class="btn" id="btn-load-spr">Load .spr</button>
  <input type="file" id="file-spr" accept=".spr" style="display:none">
  <button class="btn" id="btn-load-bmp">Load .bmp</button>
  <input type="file" id="file-bmp" accept=".bmp,image/*" style="display:none">
  <button class="btn" id="btn-save-spr">Save .spr</button>
  <button class="btn" id="btn-save-bmp">Save .bmp</button>
  <div style="width:1px;height:20px;background:#533483;margin:0 4px"></div>
  <label>W:</label><input id="inp-w" type="number" min="1" max="512" value="16" style="width:44px;background:#0a0a1a;border:1px solid #533483;color:#0f0;padding:2px;font-family:inherit;font-size:11px">
  <label>H:</label><input id="inp-h" type="number" min="1" max="256" value="16" style="width:44px;background:#0a0a1a;border:1px solid #533483;color:#0f0;padding:2px;font-family:inherit;font-size:11px">
  <button class="btn" id="btn-resize">Resize</button>
  <div style="width:1px;height:20px;background:#533483;margin:0 4px"></div>
  <label>Zoom:</label>
  <button class="btn" id="btn-zm">−</button>
  <span id="zoom-val">8x</span>
  <button class="btn" id="btn-zp">+</button>
  <div style="width:1px;height:20px;background:#533483;margin:0 4px"></div>
  <button class="btn" id="btn-fliph">Flip H</button>
  <button class="btn" id="btn-flipv">Flip V</button>
  <button class="btn" id="btn-rot">Rot 90</button>
  <button class="btn" id="btn-clear">Clear</button>
  <span id="info-bar">Pixel format: 8-bit indexed | Transparent = index 0</span>
</div>

<div id="main">
  <!-- LEFT SIDEBAR: TOOLS -->
  <div id="sidebar-left">
    <button class="tool-btn active" id="tool-pencil" title="Pencil (P)">✏</button>
    <button class="tool-btn" id="tool-eraser" title="Eraser (E)">⌫</button>
    <button class="tool-btn" id="tool-fill" title="Fill (F)">🪣</button>
    <button class="tool-btn" id="tool-eyedrop" title="Eyedropper (I)">💧</button>
    <button class="tool-btn" id="tool-line" title="Line (L)">╱</button>
    <button class="tool-btn" id="tool-rect" title="Rectangle (R)">▭</button>
    <button class="tool-btn" id="tool-ellipse" title="Ellipse">○</button>
    <button class="tool-btn" id="tool-select" title="Select (S)">⬚</button>
    <div class="sidebar-sep"></div>
    <div class="swatch-wrap" title="FG/BG color (click to edit in palette)">
      <div id="bg-swatch"></div>
      <div id="fg-swatch"></div>
      <button id="swap-btn" title="Swap FG/BG">⇄</button>
    </div>
    <div class="sidebar-sep"></div>
    <button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)" style="font-size:12px">↺</button>
    <button class="tool-btn" id="btn-redo" title="Redo (Ctrl+Y)" style="font-size:12px">↻</button>
    <div class="sidebar-sep"></div>
    <button class="tool-btn" id="btn-grid" title="Toggle grid (G)" style="font-size:11px">▦</button>
    <button class="tool-btn" id="btn-anim-play" title="Play animation" style="font-size:14px">▶</button>
  </div>

  <!-- CENTER: EDITOR CANVAS -->
  <div id="canvas-area">
    <canvas id="editor-canvas"></canvas>
    <div id="pos-label">0, 0</div>
  </div>

  <!-- RIGHT SIDEBAR -->
  <div id="sidebar-right">
    <!-- Palette -->
    <div id="palette-panel">
      <div class="panel-title">PALETTE (48 entries) <span id="pal-edit-toggle">edit ▾</span></div>
      <div id="palette-grid"></div>
      <div id="pal-editor">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <div id="pal-preview"></div>
          <span id="pal-idx-label" style="color:#888">idx: 1</span>
          <input id="pal-hex" type="text" maxlength="7" placeholder="#rrggbb">
          <button class="btn" id="btn-pal-apply" style="padding:2px 6px">Set</button>
        </div>
        <label>R <input type="range" id="sl-r" min="0" max="255"></label>
        <label>G <input type="range" id="sl-g" min="0" max="255"></label>
        <label>B <input type="range" id="sl-b" min="0" max="255"></label>
      </div>
    </div>

    <!-- Sprite sheet -->
    <div id="sheet-panel">
      <div class="panel-title">SPRITE SHEET <span id="sheet-fit-btn">fit</span></div>
      <div id="sheet-wrap">
        <canvas id="sheet-canvas"></canvas>
      </div>
      <div id="sheet-info">Click a frame to edit it</div>
    </div>
  </div>
</div>

<!-- BOTTOM: ANIMATION PREVIEW + FRAMES -->
<div id="bottom-bar">
  <canvas id="anim-canvas" width="64" height="64"></canvas>
  <div id="anim-controls">
    <label>FPS: <input id="inp-fps" type="number" min="1" max="60" value="8" style="width:36px;background:#0a0a1a;border:1px solid #533483;color:#0f0;padding:1px 3px;font-family:inherit;font-size:11px"></label>
    <label>Frame W: <input id="inp-fw" type="number" min="1" max="512" value="16" style="width:44px;background:#0a0a1a;border:1px solid #533483;color:#0f0;padding:1px 3px;font-family:inherit;font-size:11px"></label>
  </div>
  <div id="frame-strip"></div>
  <div id="bottom-info">sprite: —<br>size: —</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  GACEK SPRITE EDITOR
//  Format: raw 8-bit indexed, no header, row-major, 0=transparent
//  Sprite sheets are stored bottom-row-first in VBXE (but .spr files
//  on disk are stored top-row-first as normal bitmaps).
// ═══════════════════════════════════════════════════════════════════

// ── VBXE palette (48 entries, indices 1..48, index 0 = transparent) ──
const DEFAULT_PALETTE = [
  [0,0,0],        // 0  transparent (not in tab_color)
  [0x00,0x00,0x00], // 1
  [0xff,0xff,0xff], // 2
  [0xff,0x00,0x00], // 3
  [0x00,0xa0,0xc0], // 4
  [0xff,0xff,0x00], // 5
  [0xe0,0xc0,0x80], // 6
  [0x2a,0x2a,0x2a], // 7
  [0x88,0x88,0x88], // 8
  [0xbb,0xbb,0xbb], // 9
  [0xdd,0xdd,0xdd], // 0a=10
  [0xa0,0xa0,0x00], // 0b=11
  [0xc0,0xc0,0x00], // 0c=12
  [0xe0,0xe0,0x00], // 0d=13
  [0xff,0xff,0x00], // 0e=14
  [0xaa,0xaa,0xaa], // 0f=15
  [0x44,0x44,0x44], // 10=16
  [0x66,0x66,0x66], // 11=17
  [0x88,0x88,0x88], // 12=18
  [0x00,0x00,0xff], // 13=19  letter blue
  [0xcc,0xcc,0xcc], // 14=20
  [0xff,0x00,0x33], // 15=21  paraliz0
  [0xcc,0x00,0xff], // 16=22  paraliz1
  [0x80,0x00,0x00], // 17=23
  [0xe0,0x20,0x40], // 18=24
  [0xff,0xff,0x00], // 19=25
  [0xc0,0x80,0x40], // 1a=26
  [0x80,0x00,0x00], // 1b=27  bomb red0
  [0xc0,0x20,0x00], // 1c=28  bomb red1
  [0xa0,0x20,0x00], // 1d=29  lit bomb0
  [0xff,0xff,0x00], // 1e=30  lit bomb1
  [0x00,0x00,0x00], // 1f=31  game over black
  [0xff,0x33,0x00], // 20=32  ramp gradient
  [0xff,0x55,0x00], // 21=33
  [0xff,0x77,0x00], // 22=34
  [0xff,0x99,0x00], // 23=35
  [0xff,0xbb,0x00], // 24=36
  [0xff,0xcc,0x00], // 25=37
  [0xff,0xdd,0x00], // 26=38
  [0xff,0xff,0x00], // 27=39
  [0xff,0x00,0x00], // 28=40  start0
  [0x00,0xff,0x00], // 29=41  start1
  [0xff,0x00,0x88], // 2a=42  title
  [0x00,0x88,0xff], // 2b=43
  [0xff,0xaa,0x00], // 2c=44
  [0x00,0xbb,0xff], // 2d=45
  [0x00,0x55,0xff], // 2e=46
  [0xff,0xff,0xff], // 2f=47
  [0xff,0x00,0x00], // 30=48  last title color
];

// Known sprite files with dimensions (width x height)
const SPRITE_DEFS = [
  { name: 'right.spr',          w: 76,  h: 16,  label: 'Jack right (4 frames)' },
  { name: 'left.spr',           w: 76,  h: 16,  label: 'Jack left (4 frames)' },
  { name: 'jack_lata.spr',      w: 160, h: 16,  label: 'Jack flying' },
  { name: 'jack_spada.spr',     w: 36,  h: 16,  label: 'Jack falling' },
  { name: 'jack_upada.spr',     w: 44,  h: 16,  label: 'Jack landing' },
  { name: 'jack_stoi.spr',      w: 16,  h: 16,  label: 'Jack standing' },
  { name: 'jack_tanczy.spr',    w: 56,  h: 16,  label: 'Jack dancing' },
  { name: 'mumia.spr',          w: 348, h: 16,  label: 'Mummy + bird + radar' },
  { name: 'globus.spr',         w: 320, h: 16,  label: 'Globe + ball' },
  { name: 'buzka.spr',          w: 64,  h: 16,  label: 'Smiley (paralysis)' },
  { name: 'literki.spr',        w: 140, h: 16,  label: 'Letters B/E' },
  { name: 'paraliz.spr',        w: 64,  h: 16,  label: 'P letter (paralysis)' },
  { name: 'przemiana.spr',      w: 64,  h: 16,  label: 'Metamorphosis' },
  { name: 'explo.spr',          w: 64,  h: 16,  label: 'Explosion' },
  { name: 'ufo.spr',            w: 120, h: 16,  label: 'UFO (6 frames)' },
  { name: 'bomby.spr',          w: 100, h: 16,  label: 'Bombs' },
  { name: 'czapka.spr',         w: 76,  h: 16,  label: 'Hat enemy (4 frames)' },
  { name: 'punkty.spr',         w: 180, h: 16,  label: 'Score values' },
  { name: 'xpunkty.spr',        w: 52,  h: 16,  label: 'Score multipliers' },
  { name: 'rampa_poziom.spr',   w: 8,   h: 8,   label: 'Ramp horizontal' },
  { name: 'rampa_pion.spr',     w: 8,   h: 8,   label: 'Ramp vertical' },
  { name: 'rampa_lg.spr',       w: 8,   h: 8,   label: 'Ramp corner LG' },
  { name: 'rampa_pg.spr',       w: 8,   h: 8,   label: 'Ramp corner PG' },
  { name: 'rampa_ld.spr',       w: 8,   h: 8,   label: 'Ramp corner LD' },
  { name: 'rampa_pd.spr',       w: 8,   h: 8,   label: 'Ramp corner PD' },
  { name: 'gameover.spr',       w: 32,  h: 24,  label: 'Game Over' },
  { name: 'start0.spr',         w: 64,  h: 16,  label: 'Start screen 0' },
  { name: 'start1.spr',         w: 64,  h: 16,  label: 'Start screen 1' },
  { name: 'title0.spr',         w: 192, h: 40,  label: 'Title part 0' },
  { name: 'title1.spr',         w: 192, h: 40,  label: 'Title part 1' },
  { name: 'title.spr',          w: 192, h: 80,  label: 'Title (full)' },
];

// ═══════════════════════
//  STATE
// ═══════════════════════
let palette = DEFAULT_PALETTE.map(c => [...c]);
let spriteW = 16, spriteH = 16;
let pixels = new Uint8Array(spriteW * spriteH); // indexed pixel data
let zoom = 8;
let currentTool = 'pencil';
let fgColor = 3;   // palette index
let bgColor = 0;   // palette index (0=transparent)
let showGrid = true;
let undoStack = [], redoStack = [];
let isDrawing = false;
let lastX = -1, lastY = -1;
let selStart = null, selEnd = null;
let lineStart = null;
let previewPixels = null; // for line/rect/ellipse preview
let animFrame = 0, animTimer = null;
let frameW = 16;  // width of one animation frame
let currentSpriteDef = null;
let selectedPalIdx = 1;
let palEditMode = false; // fg=true, bg=false
let sheetZoom = 2;
let currentFilename = 'untitled.spr';
let sheetHighlightX = -1;

// ═══════════════════════
//  ELEMENTS
// ═══════════════════════
const canvas = document.getElementById('editor-canvas');
const ctx = canvas.getContext('2d');
const sheetCanvas = document.getElementById('sheet-canvas');
const sheetCtx = sheetCanvas.getContext('2d');
const animCanvas = document.getElementById('anim-canvas');
const animCtx = animCanvas.getContext('2d');
const posLabel = document.getElementById('pos-label');
const inpW = document.getElementById('inp-w');
const inpH = document.getElementById('inp-h');
const inpFps = document.getElementById('inp-fps');
const inpFw = document.getElementById('inp-fw');
const bottomInfo = document.getElementById('bottom-info');
const zoomVal = document.getElementById('zoom-val');
const frameStrip = document.getElementById('frame-strip');
const sheetInfo = document.getElementById('sheet-info');

// ═══════════════════════
//  PALETTE HELPERS
// ═══════════════════════
function palColor(idx) {
  if (idx === 0) return null; // transparent
  const c = palette[idx] || [0,0,0];
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function palColorHex(idx) {
  if (!palette[idx]) return '#000000';
  const [r,g,b] = palette[idx];
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

// ═══════════════════════
//  BUILD PALETTE GRID
// ═══════════════════════
function buildPaletteGrid() {
  const grid = document.getElementById('palette-grid');
  grid.innerHTML = '';
  for (let i = 0; i < 49; i++) {
    const cell = document.createElement('div');
    cell.className = 'pal-cell' + (i===0?' idx0':'');
    cell.dataset.idx = i;
    if (i > 0) cell.style.background = palColorHex(i);
    cell.title = `Index ${i} (0x${i.toString(16).toUpperCase()})`;
    cell.addEventListener('mousedown', e => {
      if (e.button === 0) { fgColor = i; updateSwatches(); }
      else if (e.button === 2) { bgColor = i; updateSwatches(); }
      updatePaletteSelection();
      openPalEdit(i);
      e.preventDefault();
    });
    cell.addEventListener('contextmenu', e => e.preventDefault());
    grid.appendChild(cell);
  }
  updatePaletteSelection();
}

function updatePaletteSelection() {
  document.querySelectorAll('.pal-cell').forEach(c => {
    const i = +c.dataset.idx;
    c.classList.toggle('selected-fg', i === fgColor);
    c.classList.toggle('selected-bg', i === bgColor && i !== fgColor);
  });
}

function updateSwatches() {
  const fg = document.getElementById('fg-swatch');
  const bg = document.getElementById('bg-swatch');
  if (fgColor === 0) {
    fg.style.background = 'repeating-conic-gradient(#444 0% 25%, #222 0% 50%) 0 0 / 8px 8px';
  } else {
    fg.style.background = palColorHex(fgColor);
  }
  if (bgColor === 0) {
    bg.style.background = 'repeating-conic-gradient(#444 0% 25%, #222 0% 50%) 0 0 / 8px 8px';
  } else {
    bg.style.background = palColorHex(bgColor);
  }
  updatePaletteSelection();
}

function openPalEdit(idx) {
  selectedPalIdx = idx;
  document.getElementById('pal-idx-label').textContent = `idx: ${idx} (0x${idx.toString(16)})`;
  if (idx === 0) {
    document.getElementById('pal-preview').style.background = 'repeating-conic-gradient(#444 0% 25%, #222 0% 50%) 0 0 / 6px 6px';
    document.getElementById('pal-hex').value = '(transparent)';
    return;
  }
  const [r,g,b] = palette[idx];
  document.getElementById('sl-r').value = r;
  document.getElementById('sl-g').value = g;
  document.getElementById('sl-b').value = b;
  document.getElementById('pal-hex').value = palColorHex(idx);
  document.getElementById('pal-preview').style.background = palColorHex(idx);
}

function applyPalEdit() {
  if (selectedPalIdx === 0) return;
  const r = +document.getElementById('sl-r').value;
  const g = +document.getElementById('sl-g').value;
  const b = +document.getElementById('sl-b').value;
  palette[selectedPalIdx] = [r, g, b];
  openPalEdit(selectedPalIdx);
  buildPaletteGrid();
  updateSwatches();
  renderCanvas();
  renderSheet();
}

['sl-r','sl-g','sl-b'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    if (selectedPalIdx === 0) return;
    const r = +document.getElementById('sl-r').value;
    const g = +document.getElementById('sl-g').value;
    const b = +document.getElementById('sl-b').value;
    palette[selectedPalIdx] = [r, g, b];
    document.getElementById('pal-hex').value = palColorHex(selectedPalIdx);
    document.getElementById('pal-preview').style.background = palColorHex(selectedPalIdx);
    // update cell immediately
    const cell = document.querySelector(`.pal-cell[data-idx="${selectedPalIdx}"]`);
    if (cell) cell.style.background = palColorHex(selectedPalIdx);
    updateSwatches();
    renderCanvas();
    renderSheet();
  });
});

document.getElementById('pal-hex').addEventListener('change', e => {
  let v = e.target.value.trim();
  if (!v.startsWith('#')) v = '#' + v;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) {
    const r = parseInt(v.slice(1,3),16), g = parseInt(v.slice(3,5),16), b = parseInt(v.slice(5,7),16);
    document.getElementById('sl-r').value = r;
    document.getElementById('sl-g').value = g;
    document.getElementById('sl-b').value = b;
    applyPalEdit();
  }
});
document.getElementById('btn-pal-apply').addEventListener('click', applyPalEdit);

document.getElementById('pal-edit-toggle').addEventListener('click', () => {
  const ed = document.getElementById('pal-editor');

// ═══════════════════════
//  UNDO / REDO
// ═══════════════════════
function pushUndo() {
  undoStack.push(pixels.slice());
  if (undoStack.length > 50) undoStack.shift();
  redoStack = [];
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(pixels.slice());
  pixels = undoStack.pop();
  renderCanvas(); renderSheet(); renderFrameStrip();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(pixels.slice());
  pixels = redoStack.pop();
  renderCanvas(); renderSheet(); renderFrameStrip();
}

// ═══════════════════════
//  CANVAS SETUP & RENDER
// ═══════════════════════
function resizeCanvas() {
  canvas.width = spriteW * zoom;
  canvas.height = spriteH * zoom;
  renderCanvas();
}

function renderCanvas(previewPx) {
  const px = previewPx || pixels;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // checkerboard for transparent
  for (let y = 0; y < spriteH; y++) {
    for (let x = 0; x < spriteW; x++) {
      const idx = px[y * spriteW + x];
      if (idx === 0) {
        const chk = ((x >> 1) ^ (y >> 1)) & 1;
        ctx.fillStyle = chk ? '#333' : '#222';
      } else {
        const c = palette[idx];
        ctx.fillStyle = c ? `rgb(${c[0]},${c[1]},${c[2]})` : '#f0f';
      }
      ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
    }
  }

  // selection overlay
  if (selStart && selEnd) {
    const x1 = Math.min(selStart.x, selEnd.x);
    const y1 = Math.min(selStart.y, selEnd.y);
    const x2 = Math.max(selStart.x, selEnd.x);
    const y2 = Math.max(selStart.y, selEnd.y);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3,3]);
    ctx.strokeRect(x1*zoom+0.5, y1*zoom+0.5, (x2-x1+1)*zoom, (y2-y1+1)*zoom);
    ctx.setLineDash([]);
  }

  // grid
  if (showGrid && zoom >= 4) {
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= spriteW; x++) { ctx.beginPath(); ctx.moveTo(x*zoom,0); ctx.lineTo(x*zoom,spriteH*zoom); ctx.stroke(); }
    for (let y = 0; y <= spriteH; y++) { ctx.beginPath(); ctx.moveTo(0,y*zoom); ctx.lineTo(spriteW*zoom,y*zoom); ctx.stroke(); }
    // frame grid (every frameW pixels)
    if (frameW > 0 && frameW < spriteW) {
      ctx.strokeStyle = 'rgba(255,80,0,0.3)';
      ctx.lineWidth = 1;
      for (let x = frameW; x < spriteW; x += frameW) {
        ctx.beginPath(); ctx.moveTo(x*zoom,0); ctx.lineTo(x*zoom,spriteH*zoom); ctx.stroke();
      }
    }
  }
}

// ═══════════════════════
//  SHEET RENDER
// ═══════════════════════
function renderSheet() {
  const sw = spriteW * sheetZoom;
  const sh = spriteH * sheetZoom;
  sheetCanvas.width = sw;
  sheetCanvas.height = sh;

  for (let y = 0; y < spriteH; y++) {
    for (let x = 0; x < spriteW; x++) {
      const idx = pixels[y * spriteW + x];
      if (idx === 0) {
        const chk = ((x>>1)^(y>>1))&1;
        sheetCtx.fillStyle = chk ? '#2a2a2a' : '#1a1a1a';
      } else {
        const c = palette[idx];
        sheetCtx.fillStyle = c ? `rgb(${c[0]},${c[1]},${c[2]})` : '#f0f';
      }
      sheetCtx.fillRect(x*sheetZoom, y*sheetZoom, sheetZoom, sheetZoom);
    }
  }

  // frame dividers
  if (frameW > 0 && frameW < spriteW) {
    sheetCtx.strokeStyle = 'rgba(233,69,96,0.5)';
    sheetCtx.lineWidth = 1;
    for (let x = frameW; x < spriteW; x += frameW) {
      sheetCtx.beginPath(); sheetCtx.moveTo(x*sheetZoom+0.5,0); sheetCtx.lineTo(x*sheetZoom+0.5,sh); sheetCtx.stroke();
    }
    // highlight current frame
    if (sheetHighlightX >= 0) {
      sheetCtx.strokeStyle = '#e94560';
      sheetCtx.lineWidth = 2;
      sheetCtx.strokeRect(sheetHighlightX*frameW*sheetZoom+1, 1, frameW*sheetZoom-2, sh-2);
    }
  }
  sheetInfo.textContent = `${spriteW}×${spriteH}px | ${Math.floor(spriteW/frameW)} frames (${frameW}px each)`;
}

// ═══════════════════════
//  FRAME STRIP + ANIM
// ═══════════════════════
function renderFrameStrip() {
  const numFrames = frameW > 0 ? Math.floor(spriteW / frameW) : 1;
  frameStrip.innerHTML = '';
  for (let f = 0; f < numFrames; f++) {
    const c = document.createElement('canvas');
    c.width = frameW; c.height = spriteH;
    c.style.width = Math.max(frameW * 2, 16) + 'px';
    c.style.height = Math.max(spriteH * 2, 16) + 'px';
    c.className = 'frame-thumb' + (f === animFrame ? ' active' : '');
    c.title = `Frame ${f}`;
    const fc = c.getContext('2d');
    drawFrame(fc, f, frameW, spriteH, 1);
    c.addEventListener('click', () => {
      animFrame = f;
      sheetHighlightX = f;
      renderFrameStrip();
      renderSheet();
      renderAnimFrame();
    });
    frameStrip.appendChild(c);
  }
  bottomInfo.innerHTML = `${currentFilename}<br>${spriteW}×${spriteH} | ${numFrames} frames`;
}

function drawFrame(fctx, frameIdx, fw, fh, scale) {
  const ox = frameIdx * fw;
  for (let y = 0; y < fh; y++) {
    for (let x = 0; x < fw; x++) {
      const idx = pixels[y * spriteW + (ox + x)];
      if (idx === 0) {
        const chk = ((x>>1)^(y>>1))&1;
        fctx.fillStyle = chk ? '#333' : '#222';
      } else {
        const c = palette[idx];
        fctx.fillStyle = c ? `rgb(${c[0]},${c[1]},${c[2]})` : '#f0f';
      }
      fctx.fillRect(x*scale, y*scale, scale, scale);
    }
  }
}

function renderAnimFrame() {
  const sz = 3;
  animCanvas.width = frameW * sz;
  animCanvas.height = spriteH * sz;
  animCtx.clearRect(0, 0, animCanvas.width, animCanvas.height);
  drawFrame(animCtx, animFrame, frameW, spriteH, sz);
}

function startAnim() {
  stopAnim();
  const fps = Math.max(1, +inpFps.value);
  const numFrames = Math.floor(spriteW / frameW) || 1;
  animTimer = setInterval(() => {
    animFrame = (animFrame + 1) % numFrames;
    renderAnimFrame();
    renderFrameStrip();
  }, 1000 / fps);
}
function stopAnim() {
  if (animTimer) { clearInterval(animTimer); animTimer = null; }
}

// ═══════════════════════
//  DRAWING TOOLS
// ═══════════════════════
function canvasXY(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX - rect.left) / zoom),
    y: Math.floor((e.clientY - rect.top) / zoom)
  };
}

function inBounds(x, y) { return x >= 0 && y >= 0 && x < spriteW && y < spriteH; }

function setPixel(x, y, colorIdx) {
  if (!inBounds(x, y)) return;
  pixels[y * spriteW + x] = colorIdx;
}

function getPixel(x, y) {
  if (!inBounds(x, y)) return 0;
  return pixels[y * spriteW + x];
}

function drawLine(x0, y0, x1, y1, arr, colorIdx) {
  let dx = Math.abs(x1-x0), dy = Math.abs(y1-y0);
  let sx = x0<x1?1:-1, sy = y0<y1?1:-1;
  let err = dx-dy;
  while (true) {
    if (inBounds(x0,y0)) arr[y0*spriteW+x0] = colorIdx;
    if (x0===x1 && y0===y1) break;
    let e2 = 2*err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx)  { err += dx; y0 += sy; }
  }
}

function floodFill(x, y, fillIdx) {
  const targetIdx = getPixel(x, y);
  if (targetIdx === fillIdx) return;
  const stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (!inBounds(cx, cy) || pixels[cy*spriteW+cx] !== targetIdx) continue;
    pixels[cy*spriteW+cx] = fillIdx;
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
}

function drawRect(px, x0, y0, x1, y1, colorIdx) {
  const x_min=Math.min(x0,x1), x_max=Math.max(x0,x1);
  const y_min=Math.min(y0,y1), y_max=Math.max(y0,y1);
  for (let x=x_min; x<=x_max; x++) { if(inBounds(x,y_min)) px[y_min*spriteW+x]=colorIdx; if(inBounds(x,y_max)) px[y_max*spriteW+x]=colorIdx; }
  for (let y=y_min; y<=y_max; y++) { if(inBounds(x_min,y)) px[y*spriteW+x_min]=colorIdx; if(inBounds(x_max,y)) px[y*spriteW+x_max]=colorIdx; }
}

function drawEllipse(px, x0, y0, x1, y1, colorIdx) {
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const rx=Math.abs(x1-x0)/2, ry=Math.abs(y1-y0)/2;
  const steps = Math.max(rx, ry) * 8;
  for (let i=0; i<steps; i++) {
    const a = (i/steps)*2*Math.PI;
    const px2 = Math.round(cx + rx*Math.cos(a));
    const py2 = Math.round(cy + ry*Math.sin(a));
    if (inBounds(px2, py2)) px[py2*spriteW+px2] = colorIdx;
  }
}

canvas.addEventListener('mousedown', e => {
  const {x, y} = canvasXY(e);
  const color = e.button === 2 ? bgColor : fgColor;
  if (!inBounds(x, y)) return;
  e.preventDefault();

  switch (currentTool) {
    case 'eyedrop':
      const picked = getPixel(x, y);
      if (e.button === 2) bgColor = picked; else fgColor = picked;
      updateSwatches(); updatePaletteSelection(); return;
    case 'fill':
      pushUndo(); floodFill(x, y, color); renderCanvas(); renderSheet(); renderFrameStrip(); return;
    case 'line':
      lineStart = {x, y}; isDrawing = true; return;
    case 'rect': case 'ellipse':
      lineStart = {x, y}; isDrawing = true; return;
    case 'select':
      selStart = {x, y}; selEnd = {x, y}; isDrawing = true; renderCanvas(); return;
  }

  pushUndo();
  isDrawing = true;
  lastX = x; lastY = y;
  if (currentTool === 'pencil') setPixel(x, y, color);
  else if (currentTool === 'eraser') setPixel(x, y, 0);
  renderCanvas(); renderSheet(); renderFrameStrip();
});

canvas.addEventListener('mousemove', e => {
  const {x, y} = canvasXY(e);
  posLabel.textContent = `${x}, ${y}  idx:${getPixel(x,y)}`;

  if (!isDrawing) return;
  const color = e.buttons===2 ? bgColor : fgColor;

  if (currentTool === 'pencil' || currentTool === 'eraser') {
    const c = currentTool === 'eraser' ? 0 : color;
    if (x !== lastX || y !== lastY) {
      drawLine(lastX, lastY, x, y, pixels, c);
      lastX = x; lastY = y;
    }
    renderCanvas(); renderSheet(); renderFrameStrip();
  } else if (currentTool === 'line' && lineStart) {
    const prev = previewPixels ? previewPixels : pixels.slice();
    previewPixels = pixels.slice();
    drawLine(lineStart.x, lineStart.y, x, y, previewPixels, color);
    renderCanvas(previewPixels);
  } else if (currentTool === 'rect' && lineStart) {
    previewPixels = pixels.slice();
    drawRect(previewPixels, lineStart.x, lineStart.y, x, y, color);
    renderCanvas(previewPixels);
  } else if (currentTool === 'ellipse' && lineStart) {
    previewPixels = pixels.slice();
    drawEllipse(previewPixels, lineStart.x, lineStart.y, x, y, color);
    renderCanvas(previewPixels);
  } else if (currentTool === 'select') {
    selEnd = {x, y}; renderCanvas();
  }
});

canvas.addEventListener('mouseup', e => {
  if (!isDrawing) return;
  const {x, y} = canvasXY(e);
  const color = e.button===2 ? bgColor : fgColor;
  if (currentTool === 'line' && lineStart) {
    drawLine(lineStart.x, lineStart.y, x, y, pixels, color);
    previewPixels = null; lineStart = null;
    renderCanvas(); renderSheet(); renderFrameStrip();
  } else if (currentTool === 'rect' && lineStart) {
    drawRect(pixels, lineStart.x, lineStart.y, x, y, color);
    previewPixels = null; lineStart = null;
    renderCanvas(); renderSheet(); renderFrameStrip();
  } else if (currentTool === 'ellipse' && lineStart) {
    drawEllipse(pixels, lineStart.x, lineStart.y, x, y, color);
    previewPixels = null; lineStart = null;
    renderCanvas(); renderSheet(); renderFrameStrip();
  }
  isDrawing = false;
});

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mouseleave', () => { posLabel.textContent = '—'; });

// Sheet click: jump to frame
sheetCanvas.addEventListener('click', e => {
  const rect = sheetCanvas.getBoundingClientRect();

    const frame = Math.floor(x / frameW);
    animFrame = frame;
    sheetHighlightX = frame;
    renderSheet(); renderFrameStrip(); renderAnimFrame();
  }
});

document.getElementById('file-spr').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  currentFilename = file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    const data = new Uint8Array(ev.target.result);
    const w = +inpW.value, h = +inpH.value;
    if (data.length !== w * h) {
      // Try to auto-detect size from known definitions
      const found = SPRITE_DEFS.find(d => d.name === file.name);
      if (found && data.length === found.w * found.h) {
        spriteW = found.w; spriteH = found.h;
        inpW.value = spriteW; inpH.value = spriteH;
      } else if (data.length === w * h) {
        spriteW = w; spriteH = h;
      } else {
        // fallback: assume single row
        spriteW = data.length; spriteH = 1;
        inpW.value = spriteW; inpH.value = spriteH;
        alert(`Warning: file size ${data.length} doesn't match ${w}×${h}=${w*h}.\nAssuming ${spriteW}×1.`);
      }
    } else {
      spriteW = w; spriteH = h;
    }
    pixels = data.slice(0, spriteW * spriteH);
    pushUndo();
    frameW = Math.min(16, spriteW); inpFw.value = frameW;
    resizeCanvas(); renderSheet(); renderFrameStrip();
    document.getElementById('info-bar').textContent = `${file.name} | ${spriteW}×${spriteH} | ${data.length} bytes`;
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

document.getElementById('file-bmp').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  currentFilename = file.name.replace(/\.(bmp|png|gif|jpg)$/i, '.spr');
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const iw = img.width, ih = img.height;
    spriteW = iw; spriteH = ih;
    inpW.value = iw; inpH.value = ih;

    // Draw image to offscreen canvas, then quantize to palette
    const oc = document.createElement('canvas');
    oc.width = iw; oc.height = ih;
    const oc2 = oc.getContext('2d');
    oc2.drawImage(img, 0, 0);
    const imgData = oc2.getImageData(0, 0, iw, ih).data;

    pushUndo();
    pixels = new Uint8Array(iw * ih);
    for (let i = 0; i < iw * ih; i++) {
      const r = imgData[i*4], g = imgData[i*4+1], b = imgData[i*4+2], a = imgData[i*4+3];
      if (a < 128) { pixels[i] = 0; continue; }
      // Find nearest palette color
      let best = 1, bestD = Infinity;
      for (let p = 1; p < palette.length; p++) {
        const [pr,pg,pb] = palette[p];
        const d = (r-pr)**2 + (g-pg)**2 + (b-pb)**2;
        if (d < bestD) { bestD = d; best = p; }
      }
      pixels[i] = best;
    }
    frameW = Math.min(16, spriteW); inpFw.value = frameW;
    resizeCanvas(); renderSheet(); renderFrameStrip();
    URL.revokeObjectURL(url);
  };
  img.src = url;
  e.target.value = '';
});

// ═══════════════════════
//  SAVE .SPR
// ═══════════════════════
document.getElementById('btn-save-spr').addEventListener('click', () => {
  const blob = new Blob([pixels], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentFilename.endsWith('.spr') ? currentFilename : currentFilename + '.spr';
  a.click();
  URL.revokeObjectURL(a.href);
});

// ═══════════════════════
//  SAVE .BMP (24-bit uncompressed)
// ═══════════════════════
document.getElementById('btn-save-bmp').addEventListener('click', () => {
  const w = spriteW, h = spriteH;
  const rowBytes = Math.ceil(w * 3 / 4) * 4;  // BMP rows are 4-byte aligned
  const pixelDataSize = rowBytes * h;
  const fileSize = 54 + pixelDataSize;
  const buf = new ArrayBuffer(fileSize);
  const dv = new DataView(buf);
  // BMP header
  dv.setUint8(0, 0x42); dv.setUint8(1, 0x4d); // 'BM'
  dv.setUint32(2, fileSize, true);
  dv.setUint32(6, 0, true);
  dv.setUint32(10, 54, true);
  // DIB header
  dv.setUint32(14, 40, true);  // BITMAPINFOHEADER size
  dv.setInt32(18, w, true);
  dv.setInt32(22, -h, true);   // negative = top-down
  dv.setUint16(26, 1, true);   // planes
  dv.setUint16(28, 24, true);  // bpp
  dv.setUint32(30, 0, true);   // compression = none
  dv.setUint32(34, pixelDataSize, true);
  dv.setInt32(38, 2835, true); dv.setInt32(42, 2835, true); // 72dpi
  dv.setUint32(46, 0, true); dv.setUint32(50, 0, true);
  // Pixel data
  let offset = 54;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = pixels[y * w + x];
      const c = idx === 0 ? [0,0,0] : (palette[idx] || [255,0,255]);
      dv.setUint8(offset++, c[2]); // B
      dv.setUint8(offset++, c[1]); // G
      dv.setUint8(offset++, c[0]); // R
    }
    // padding
    for (let p = w*3; p < rowBytes; p++) { dv.setUint8(offset++, 0); }
  }
  const blob = new Blob([buf], { type: 'image/bmp' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentFilename.replace('.spr','') + '.bmp';
  a.click();
  URL.revokeObjectURL(a.href);
});

// ═══════════════════════
//  DRAG & DROP
// ═══════════════════════
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0]; if (!file) return;
  if (file.name.endsWith('.spr')) {
    currentFilename = file.name;
    const found = SPRITE_DEFS.find(d => d.name === file.name);
    if (found) { inpW.value = found.w; inpH.value = found.h; }
    const reader = new FileReader();
    reader.onload = ev => {
      const data = new Uint8Array(ev.target.result);
      spriteW = +inpW.value; spriteH = +inpH.value;
      if (data.length !== spriteW * spriteH && found) { spriteW = found.w; spriteH = found.h; inpW.value=spriteW; inpH.value=spriteH; }
      pixels = data.slice(0, spriteW * spriteH);
      frameW = Math.min(16, spriteW); inpFw.value = frameW;
      resizeCanvas(); renderSheet(); renderFrameStrip();
    };
    reader.readAsArrayBuffer(file);
  } else if (file.type.startsWith('image/')) {
    currentFilename = file.name.replace(/\.(bmp|png|gif|jpg)$/i, '.spr');
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      spriteW = img.width; spriteH = img.height;
      inpW.value = spriteW; inpH.value = spriteH;
      const oc = document.createElement('canvas'); oc.width=spriteW; oc.height=spriteH;
      const oc2 = oc.getContext('2d'); oc2.drawImage(img,0,0);
      const id = oc2.getImageData(0,0,spriteW,spriteH).data;
      pixels = new Uint8Array(spriteW * spriteH);
      for (let i=0; i<spriteW*spriteH; i++) {
        const r=id[i*4],g=id[i*4+1],b=id[i*4+2],a=id[i*4+3];
        if (a<128){pixels[i]=0;continue;}
        let best=1,bestD=Infinity;
        for (let p=1;p<palette.length;p++){const[pr,pg,pb]=palette[p];const d=(r-pr)**2+(g-pg)**2+(b-pb)**2;if(d<bestD){bestD=d;best=p;}}
        pixels[i]=best;
      }
      frameW=Math.min(16,spriteW);inpFw.value=frameW;
      resizeCanvas();renderSheet();renderFrameStrip();URL.revokeObjectURL(url);
    };
    img.src=url;
  }
});

// ═══════════════════════
//  KEYBOARD SHORTCUTS
// ═══════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.ctrlKey && e.key === 'z') { undo(); return; }
  if (e.ctrlKey && e.key === 'y') { redo(); return; }
  switch (e.key.toLowerCase()) {
    case 'p': currentTool='pencil'; break;
    case 'e': currentTool='eraser'; break;
    case 'f': currentTool='fill'; break;
    case 'i': currentTool='eyedrop'; break;
    case 'l': currentTool='line'; break;
    case 'r': currentTool='rect'; break;
    case 's': currentTool='select'; break;
    case 'g': showGrid=!showGrid; document.getElementById('btn-grid').classList.toggle('active',showGrid); renderCanvas(); return;
    case '+': case '=': if (zoom<32){zoom++;zoomVal.textContent=zoom+'x';resizeCanvas();} return;
    case '-': if (zoom>1){zoom=Math.max(1,zoom-1);zoomVal.textContent=zoom+'x';resizeCanvas();} return;
    default: return;
  }
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  const toolId = toolMap[currentTool]; if (toolId) document.getElementById(toolId).classList.add('active');
});

// ═══════════════════════
//  INIT
// ═══════════════════════
buildPaletteGrid();
updateSwatches();
resizeCanvas();
renderSheet();
renderFrameStrip();
renderAnimFrame();
document.getElementById('btn-grid').classList.add('active');

// Show usage hint
document.getElementById('info-bar').textContent =
  'Drag & drop .spr / .bmp  |  P=pencil E=eraser F=fill I=eyedrop L=line R=rect G=grid  |  Ctrl+Z/Y undo/redo  |  Pixel format: 8-bit indexed, 0=transparent';
</script>
