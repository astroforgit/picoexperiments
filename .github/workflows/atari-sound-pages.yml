name: Publish Atari Sound

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atari-sound-pages.yml'
      - 'atari-sound/**'
      - 'rubikchess/**'
      - 'atari/zorro/editor/**'
      - 'atari/zorro/Zorro (1985)(Datasoft)(US).xex'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Assemble static site
        run: python3 atari-sound/web/build_site.py _site
      - name: Add Qubic Chess
        run: cp -R rubikchess _site/rubikchess
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          python3 - <<'PYTHON'
          import json, os, time, urllib.request
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts"
          for attempt in range(12):
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request) as response:
                  artifacts = json.load(response)["artifacts"]
              if any(a["name"] == os.environ["ARTIFACT_NAME"] for a in artifacts):
                  break
              time.sleep(5)
          else:
              raise SystemExit("Uploaded Pages artifact is not yet available")
          PYTHON
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
